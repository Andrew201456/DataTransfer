<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081529">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Μεταφορά αρχείων</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#0b1424;--mute:#62718a;--line:#e1e8f1;--chip:#eaf0f7;--acc:#0f9d8f;--accink:#fff;--in:#d98a0b;--inbg:#fdf1da;--outbg:#dcf3f0;--err:#c0392b;--sh:0 1px 2px rgba(11,20,36,.06),0 8px 24px -12px rgba(11,20,36,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#070d19;--panel:#101c33;--ink:#e9eff8;--mute:#8da0bd;--line:#1c2d4d;--chip:#182a48;--acc:#2dd4bf;--accink:#05261f;--in:#f5b546;--inbg:#33270f;--outbg:#11353a;--err:#ff7b6b;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-tap-highlight-color:transparent}
.wrap{max-width:620px;margin:0 auto;padding:16px 16px 56px}
.ico{display:inline-flex;flex:none}
button{font:inherit;font-weight:700;color:inherit;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:11px 16px;min-height:44px;background:var(--chip);transition:transform .12s,filter .12s}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:var(--accink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand svg{width:30px;height:30px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--panel);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;color:var(--mute);box-shadow:var(--sh)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--err)}
.dot.on{background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.dot.on+.st::after{content:"Συνδεδεμένο"}
.dot:not(.on)+.st::after{content:"Σύνδεση…"}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:30px 18px 22px;color:#eaf6f6;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#17587a 0%,#0b2445 58%,#081529 100%)}
.rings{position:absolute;left:50%;top:62px}
.rings i{position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;border:1.5px solid rgba(45,212,191,.45);opacity:0;animation:ping 5.4s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.8s}.rings i:nth-child(3){animation-delay:3.6s}
@keyframes ping{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.rings i{animation:none;opacity:.25;transform:scale(.7)}.rings i:nth-child(n+2){display:none}}
.hc{position:relative}
.me-av{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#2dd4bf;color:#052b27;box-shadow:0 0 0 8px rgba(45,212,191,.18)}
.hero .nm{background:transparent;color:#fff;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;padding:4px 10px;min-height:0;gap:8px}
.hero .nm .ico{opacity:.6}
.sub{color:#a9c4d6;font-size:.92rem;margin-top:2px}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;margin-top:20px}
.seg button{background:transparent;border-radius:999px;padding:8px 18px;min-height:40px;color:#cfe3ee}
.seg button.on{background:#2dd4bf;color:#052b27}
.roomrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.roomrow input{flex:1 1 100%;max-width:240px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:14px;padding:10px 12px;text-align:center;font:800 1.5rem Manrope,system-ui;letter-spacing:.12em;min-width:0}
.roomrow input::placeholder{color:#7fa3ba;font-size:1rem;letter-spacing:0;font-weight:600}
.roomrow .hb{background:rgba(255,255,255,.12);color:#eaf6f6;font-size:.88rem;padding:8px 12px;min-height:40px}
h2{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin:30px 4px 12px}
.peer{display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;background:var(--panel);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);border:2px solid transparent;transition:border-color .15s,background .15s}
.peer.drag{border-color:var(--acc);background:var(--outbg)}
.av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--chip);color:var(--mute)}
.av.live{background:var(--outbg);color:var(--acc)}
.peer .n{flex:1 1 120px;min-width:0}
.peer .n b{display:block;font-size:1.05rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.peer .n span{color:var(--mute);font-size:.85rem}
.btns{display:flex;gap:8px;flex:1 1 100%}
.btns button{flex:1}
@media (min-width:520px){.btns{flex:0 0 auto}}
.empty{color:var(--mute);background:var(--panel);border:2px dashed var(--line);border-radius:22px;padding:22px 18px;text-align:center;font-size:.95rem}
.item{display:flex;gap:12px;background:var(--panel);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.badge{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.item.out .badge{background:var(--outbg);color:var(--acc)}
.item.in .badge{background:var(--inbg);color:var(--in)}
.body{flex:1;min-width:0}
.nm2{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--mute);font-size:.84rem}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 8px}
.bar{height:7px;background:var(--chip);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .15s}
.item.in .bar i{background:var(--in)}
.err{color:var(--err);font-size:.88rem;font-weight:600}
.dl{display:inline-flex;margin-top:8px;background:var(--in);color:#2a1a00;font-weight:800;border-radius:12px;padding:9px 14px;text-decoration:none;font-size:.92rem}
.small{padding:7px 12px;min-height:36px;font-size:.88rem}
#file{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#0b2445"/><circle cx="16" cy="16" r="9" fill="#2dd4bf"/><path d="M11 13.5h8l-2.5-2.5M21 18.5h-8l2.5 2.5" stroke="#0b2445" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Μεταφορά</div>
    <span class="pill"><span class="dot" id="dot"></span><span class="st"></span></span>
  </div>

  <section class="hero">
    <div class="rings"><i></i><i></i><i></i></div>
    <div class="hc">
      <div class="me-av" id="meav"></div>
      <button class="nm" id="rename" title="Αλλαγή ονόματος"></button>
      <div class="sub" id="mode"></div>
      <div class="seg"><button id="auto">Ίδιο δίκτυο</button><button id="roomtab">Δωμάτιο</button></div>
      <div class="roomrow" id="roomrow">
        <input type="text" id="code" placeholder="Κωδικός" autocapitalize="off" autocomplete="off">
        <button class="hb" id="join">Σύνδεση</button>
        <button class="hb" id="newcode">Νέος κωδικός</button>
        <button class="hb" id="copylink">Αντιγραφή συνδέσμου</button>
      </div>
    </div>
  </section>

  <h2>Συσκευές</h2>
  <div id="peers"></div>

  <h2>Μεταφορές</h2>
  <div id="items"><div class="empty">Τα αρχεία και τα μηνύματα που στέλνεις ή λαμβάνεις θα εμφανίζονται εδώ.</div></div>
</div>
<input type="file" id="file" multiple>

<script>
const $ = (s) => document.querySelector(s);
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith("on")) e[k] = v; else if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) e.append(c);
  return e;
};
const fmt = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

const myId = crypto.randomUUID().replace(/-/g, "").slice(0, 12);
let name = store.get("name") || ((/Android|iPhone|iPad/i.test(navigator.userAgent) ? "Κινητό" : "Υπολογιστής") + "-" + Math.floor(1000 + Math.random() * 9000));
let room = (new URLSearchParams(location.search).get("room") || store.get("room") || "").trim().toLowerCase();

const ICE = { iceServers: [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }] };
const CH = 64 * 1024, BUF = 4 * 1024 * 1024;
const peers = new Map();   // id -> {name, pc, dc, ready, q, rx, pending}
const items = [];

// ---------- Signaling ----------
let ws, retry = 0, pingT;
const sig = (to, data) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ type: "signal", to, data }));

function wsConnect() {
  clearInterval(pingT);
  const u = new URL("/ws", location.href);
  u.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  if (room) u.searchParams.set("room", room);
  ws = new WebSocket(u);
  ws.onopen = () => {
    retry = 0; $("#dot").classList.add("on");
    ws.send(JSON.stringify({ type: "hello", id: myId, name }));
    pingT = setInterval(() => ws.readyState === 1 && ws.send("ping"), 25000);
  };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "peers") syncPeers(m.peers); else if (m.type === "signal") onSignal(m.from, m.data);
  };
  ws.onclose = () => {
    $("#dot").classList.remove("on"); clearInterval(pingT);
    setTimeout(wsConnect, Math.min(1000 * 2 ** retry++, 10000));
  };
}
function syncPeers(list) {
  const ids = new Set(list.map((p) => p.id));
  for (const [id, p] of peers) if (!ids.has(id)) { reset(id); peers.delete(id); }
  for (const p of list) {
    if (!peers.has(p.id)) peers.set(p.id, { name: p.name, q: Promise.resolve() });
    else peers.get(p.id).name = p.name;
  }
  renderPeers();
}

// ---------- WebRTC ----------
function newPC(id) {
  const p = peers.get(id);
  if (p.pc) p.pc.close();
  const pc = new RTCPeerConnection(ICE);
  p.pc = pc; p.pending = [];
  pc.onicecandidate = (e) => e.candidate && sig(id, { ice: e.candidate });
  pc.onconnectionstatechange = () => { if (["failed", "closed", "disconnected"].includes(pc.connectionState)) reset(id); };
  return pc;
}
function reset(id) {
  const p = peers.get(id); if (!p) return;
  try { p.pc && p.pc.close(); } catch {}
  p.pc = p.dc = p.ready = null; p.rx = null;
  renderPeers();
}
function setupDC(id, dc, onopen) {
  const p = peers.get(id);
  dc.binaryType = "arraybuffer";
  dc.bufferedAmountLowThreshold = 512 * 1024;
  dc.onopen = () => { p.dc = dc; p.ready = p.ready || Promise.resolve(dc); onopen && onopen(dc); renderPeers(); };
  dc.onmessage = (e) => onData(id, e.data);
  dc.onclose = () => reset(id);
}
function connect(id) {
  const p = peers.get(id);
  if (!p) return Promise.reject(new Error("Η συσκευή αποσυνδέθηκε"));
  if (p.dc && p.dc.readyState === "open") return Promise.resolve(p.dc);
  if (p.ready) return p.ready;
  p.ready = new Promise((res, rej) => {
    const pc = newPC(id);
    setupDC(id, pc.createDataChannel("f"), res);
    pc.createOffer().then((o) => pc.setLocalDescription(o)).then(() => sig(id, { sdp: pc.localDescription })).catch(rej);
    setTimeout(() => rej(new Error("Δεν ήταν δυνατή η σύνδεση")), 20000);
  });
  p.ready.catch(() => reset(id));
  return p.ready;
}
async function onSignal(id, d) {
  const p = peers.get(id); if (!p) return;
  try {
    if (d.sdp) {
      if (d.sdp.type === "offer") {
        if (p.pc && p.pc.signalingState === "have-local-offer" && myId > id) return; // glare
        const pc = newPC(id);
        pc.ondatachannel = (e) => setupDC(id, e.channel);
        await pc.setRemoteDescription(d.sdp);
        await pc.setLocalDescription(await pc.createAnswer());
        sig(id, { sdp: pc.localDescription });
        for (const c of p.pending.splice(0)) await pc.addIceCandidate(c);
      } else if (p.pc) {
        await p.pc.setRemoteDescription(d.sdp);
        for (const c of p.pending.splice(0)) await p.pc.addIceCandidate(c);
      }
    } else if (d.ice && p.pc) {
      if (p.pc.remoteDescription) await p.pc.addIceCandidate(d.ice); else p.pending.push(d.ice);
    }
  } catch (e) { console.warn(e); }
}

// ---------- Μεταφορά ----------
let tick = 0;
const touch = () => { if (!tick) tick = requestAnimationFrame(() => { tick = 0; renderItems(); }); };
const addItem = (o) => { items.unshift(o); touch(); return o; };
const drain = (dc) => new Promise((r) => dc.addEventListener("bufferedamountlow", r, { once: true }));

function enqueue(id, fn) { const p = peers.get(id); if (p) p.q = p.q.then(fn); }

function sendFiles(id, files) {
  const p = peers.get(id); if (!p) return;
  for (const f of files) {
    const it = addItem({ dir: "out", peer: p.name, name: f.name, size: f.size, got: 0 });
    enqueue(id, async () => {
      try {
        const dc = await connect(id);
        dc.send(JSON.stringify({ t: "meta", name: f.name, size: f.size, type: f.type }));
        for (let o = 0; o < f.size; o += CH) {
          const buf = await f.slice(o, o + CH).arrayBuffer();
          if (dc.readyState !== "open") throw new Error("Η σύνδεση έκλεισε");
          if (dc.bufferedAmount > BUF) await drain(dc);
          dc.send(buf);
          it.got = Math.min(o + CH, f.size); touch();
        }
        while (dc.bufferedAmount > 0 && dc.readyState === "open") await new Promise((r) => setTimeout(r, 50));
        it.got = f.size; it.done = true;
      } catch (e) { it.err = e.message || "Σφάλμα"; }
      touch();
    });
  }
}
function sendText(id, text) {
  const p = peers.get(id); if (!p || !text) return;
  const it = addItem({ dir: "out", peer: p.name, text, done: true });
  enqueue(id, async () => {
    try { (await connect(id)).send(JSON.stringify({ t: "text", text })); }
    catch (e) { it.err = e.message || "Σφάλμα"; touch(); }
  });
}
function onData(id, d) {
  const p = peers.get(id); if (!p) return;
  if (typeof d === "string") {
    const m = JSON.parse(d);
    if (m.t === "text") addItem({ dir: "in", peer: p.name, text: m.text, done: true });
    else if (m.t === "meta") {
      const it = addItem({ dir: "in", peer: p.name, name: m.name, size: m.size, got: 0 });
      p.rx = { m, chunks: [], it };
      if (m.size === 0) finish(p);
    }
  } else if (p.rx) {
    p.rx.chunks.push(d); p.rx.it.got += d.byteLength; touch();
    if (p.rx.it.got >= p.rx.m.size) finish(p);
  }
}
function finish(p) {
  const r = p.rx; p.rx = null;
  r.it.url = URL.createObjectURL(new Blob(r.chunks, { type: r.m.type || "application/octet-stream" }));
  r.it.done = true; touch();
}

// ---------- UI ----------
let target = null;
const ICONS = {
  phone: '<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
  laptop: '<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2.5 19.5h19"/>',
  up: '<path d="M12 19V5m-6 6 6-6 6 6"/>',
  down: '<path d="M12 5v14m-6-6 6 6 6-6"/>',
  text: '<path d="M5 7h14M5 12h14M5 17h9"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
};
const ico = (n, s = 22) => { const e = document.createElement("span"); e.className = "ico"; e.innerHTML = `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`; return e; };
const isPhone = (n) => /^Κινητ/i.test(n);

function renderPeers() {
  const box = $("#peers"); box.replaceChildren();
  if (!peers.size) {
    box.append(h("div", { class: "empty" }, room
      ? "Κανείς άλλος στο δωμάτιο «" + room + "». Άνοιξε το app σε άλλη συσκευή και βάλε τον ίδιο κωδικό."
      : "Δεν βρέθηκε άλλη συσκευή στο ίδιο δίκτυο. Άνοιξε το app σε άλλη συσκευή με το ίδιο WiFi ή χρησιμοποίησε δωμάτιο."));
    return;
  }
  for (const [id, p] of peers) {
    const open = p.dc && p.dc.readyState === "open";
    const card = h("div", { class: "peer" },
      h("div", { class: "av" + (open ? " live" : "") }, ico(isPhone(p.name) ? "phone" : "laptop", 26)),
      h("div", { class: "n" }, h("b", {}, p.name), h("span", {}, open ? "Άμεση σύνδεση ενεργή" : "Έτοιμη για σύνδεση")),
      h("div", { class: "btns" },
        h("button", { class: "pri", onclick: () => { target = id; $("#file").click(); } }, ico("up", 18), "Αρχεία"),
        h("button", { onclick: () => { const t = prompt("Κείμενο ή σύνδεσμος για αποστολή σε " + p.name); t && sendText(id, t); } }, ico("text", 18), "Κείμενο")));
    card.ondragover = (e) => { e.preventDefault(); card.classList.add("drag"); };
    card.ondragleave = () => card.classList.remove("drag");
    card.ondrop = (e) => { e.preventDefault(); card.classList.remove("drag"); if (e.dataTransfer.files.length) sendFiles(id, [...e.dataTransfer.files]); };
    box.append(card);
  }
}
function renderItems() {
  const box = $("#items");
  if (!items.length) return;
  box.replaceChildren(...items.map((it) => {
    const out = it.dir === "out";
    const who = (out ? "προς " : "από ") + it.peer;
    const body = h("div", { class: "body" });
    if (it.text !== undefined) {
      body.append(h("div", { class: "meta" }, who), h("div", { class: "txt" }, it.text),
        h("button", { class: "small", onclick: () => navigator.clipboard && navigator.clipboard.writeText(it.text) }, "Αντιγραφή"));
    } else {
      const pct = it.size ? Math.round(it.got / it.size * 100) : 0;
      body.append(h("div", { class: "nm2" }, it.name),
        h("div", { class: "meta" }, fmt(it.size) + " · " + who + (it.err ? "" : it.done ? " · ολοκληρώθηκε" : " · " + pct + "%")));
      if (it.err) body.append(h("div", { class: "err" }, it.err));
      else if (!it.done) body.append(h("div", { class: "bar" }, h("i", { style: "width:" + pct + "%" })));
      if (!out && it.url) body.append(h("a", { class: "dl", href: it.url, download: it.name }, "Λήψη αρχείου"));
    }
    return h("div", { class: "item " + (out ? "out" : "in") }, h("div", { class: "badge" }, ico(out ? "up" : "down", 18)), body);
  }));
}
function renderMode() {
  $("#rename").textContent = name; $("#rename").append(ico("edit", 15));
  $("#meav").replaceChildren(ico(isPhone(name) ? "phone" : "laptop", 30));
  $("#mode").textContent = room ? "Δωμάτιο " + room : "Βρίσκω αυτόματα συσκευές στο ίδιο δίκτυο";
  $("#auto").classList.toggle("on", !room);
  $("#roomtab").classList.toggle("on", !!room);
  $("#roomrow").style.display = room ? "" : "none";
  $("#code").value = room;
}
function setRoom(r) {
  room = r.trim().toLowerCase();
  store.set("room", room);
  history.replaceState(null, "", room ? "?room=" + encodeURIComponent(room) : location.pathname);
  for (const id of [...peers.keys()]) reset(id);
  peers.clear(); renderPeers(); renderMode();
  ws.onclose = null; ws.close(); clearInterval(pingT);
  $("#dot").classList.remove("on");
  wsConnect();
}
$("#roomtab").onclick = () => { if (!room) setRoom(String(Math.floor(1000 + Math.random() * 9000))); };

$("#file").onchange = (e) => { if (target) sendFiles(target, [...e.target.files]); e.target.value = ""; };
$("#join").onclick = () => setRoom($("#code").value);
$("#code").onkeydown = (e) => e.key === "Enter" && setRoom($("#code").value);
$("#newcode").onclick = () => setRoom(String(Math.floor(1000 + Math.random() * 9000)));
$("#auto").onclick = () => setRoom("");
$("#copylink").onclick = () => navigator.clipboard && navigator.clipboard.writeText(location.origin + "/?room=" + encodeURIComponent(room));
$("#rename").onclick = () => {
  const n = prompt("Όνομα αυτής της συσκευής", name);
  if (n && n.trim()) { name = n.trim().slice(0, 40); store.set("name", name); renderMode(); ws.readyState === 1 && ws.send(JSON.stringify({ type: "hello", id: myId, name })); }
};
document.addEventListener("visibilitychange", () => { if (!document.hidden && ws.readyState > 1) { retry = 0; wsConnect(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
renderMode(); renderPeers(); wsConnect();
</script>
</body>
</html>
