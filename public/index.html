<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c1220">
  <meta name="description" content="Άμεση μεταφορά αρχείων μεταξύ συσκευών.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
  <title>DataTransfer</title>
</head>
<body data-signal-state="searching">
  <main class="app">
    <header class="header">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none"><path d="M5 9h18l-5-5m5 5-5 5M23 19H5l5-5m-5 5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <div class="brand-info"><strong>DataTransfer</strong><small id="meName">Συσκευή</small></div>
      </div>
      <button id="rename" type="button" class="rename" aria-label="Μετονομασία συσκευής" title="Μετονομασία">✎</button>
    </header>
    <section class="radar" aria-label="Κατάσταση σύνδεσης">
      <div class="signal-visual" aria-hidden="true">
        <span class="signal-wave wave-one"></span>
        <span class="signal-wave wave-two"></span>
        <span class="signal-wave wave-three"></span>
        <span class="signal-core">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 27v13M18 40h12M24 27l-9-14M24 27l9-14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24" cy="20" r="4.3" fill="currentColor"/>
          </svg>
          <span class="signal-check">✓</span>
        </span>
      </div>
      <div class="status" role="status" aria-live="polite"><i id="dot"></i><span id="connectionText">Αναζήτηση…</span></div>
    </section>

    <section class="section" aria-labelledby="peersTitle">
      <div class="heading"><h2 id="peersTitle">Συσκευές</h2><small id="peerCount">0 συσκευές</small></div>
      <div id="peers" class="peer-grid"><div class="peers-empty">Άνοιξε την εφαρμογή και στην άλλη συσκευή.</div></div>
    </section>

    <section class="section" aria-label="Αποστολή αρχείων">
      <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Επιλογή αρχείων για αποστολή">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 31V11m-8 9 8-9 8 9M11 31v8h26v-8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <strong>+ Αποστολή αρχείων</strong>
        <span>Πάτησε ή σύρε εδώ</span>
      </div>
      <input id="file" type="file" multiple hidden>
    </section>

    <section class="section history-section" id="historySection" aria-labelledby="historyTitle" hidden>
      <div class="heading"><h2 id="historyTitle">Μεταφορές</h2></div>
      <div id="items" class="transfers"></div>
    </section>
    <footer class="footer">Έως 256 MB ανά αρχείο · Έλεγξε τον παραλήπτη πριν την αποστολή.</footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
